<!DOCTYPE html>
<html lang="ro">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Autentificare - Sistem de monitorizare GPS
    </title>

    <link
        rel="stylesheet"
        href="css/base.css?v=3"
    >

    <link
        rel="stylesheet"
        href="css/login.css?v=2"
    >

</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <div class="login-header">

                <div class="login-logo">
                    GPS
                </div>

                <h1>
                    Sistem de monitorizare GPS
                </h1>

                <p>
                    Autentifică-te pentru a accesa aplicația.
                </p>

            </div>

            <form id="login-form">

                <div class="login-field">

                    <label for="username">
                        Nume utilizator
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        maxlength="50"
                        required
                    >

                </div>

                <div class="login-field">

                    <label for="password">
                        Parolă
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password-button"
                            class="password-toggle"
                            aria-label="Afișează parola"
                        >
                            Afișează
                        </button>

                    </div>

                </div>

                <div
                    id="login-message"
                    class="login-message"
                    role="alert"
                    aria-live="polite"
                ></div>

                <button
                    type="submit"
                    id="login-button"
                    class="login-button"
                >
                    Conectare
                </button>

            </form>

            <div class="login-footer">
                Accesul este permis doar utilizatorilor autorizați.
            </div>

        </section>

    </main>

    <script src="js/auth.js?v=9"></script>
    <script src="js/login.js?v=4"></script>

</body>

</html>
