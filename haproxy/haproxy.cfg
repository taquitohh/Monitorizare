global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend web_frontend
    bind *:80

    acl is_api path_beg /api

    use_backend api_servers if is_api
    default_backend frontend_servers

backend frontend_servers
    balance roundrobin

    server frontend frontend:8000 check

backend api_servers
    balance roundrobin

    server web1 web1:5000 check
    server web2 web2:5000 check
# end
